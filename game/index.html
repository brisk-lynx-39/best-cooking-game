<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sizzle Shift — a tiny rush-hour cooking game</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; background: #1d130c; height: 100%; }
  body { display: flex; align-items: center; justify-content: center; font-family: Georgia, 'Times New Roman', serif; }
  #wrap { position: relative; width: 1280px; height: 800px; max-width: 100vw; }
  canvas { display: block; width: 100%; height: 100%; background: #2a1a10; border-radius: 6px; box-shadow: 0 18px 60px rgba(0,0,0,.55); }
  #hint { position: absolute; left: 0; right: 0; bottom: -26px; text-align: center; color: #c9a877; font-size: 13px; letter-spacing: .04em; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="800"></canvas>
  <div id="hint">Click ingredients to build the plate &middot; grill patties &amp; bacon to the golden window &middot; Space = serve &middot; keys 1&ndash;7 pick ingredients</div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
